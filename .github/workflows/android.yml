name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install background notification plugins
        run: npm install @capacitor/background-runner@latest-7 @capacitor/local-notifications@latest-7
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Apply WORLDWATCH Android launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cat > android/app/src/main/res/drawable/ic_worldwatch_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#090D14" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#00000000" android:strokeColor="#FF354A" android:strokeWidth="3" android:pathData="M54,10 A44,44 0,1 0,54 98 A44,44 0,1 0,54 10"/>
            <path android:fillColor="#00000000" android:strokeColor="#9AC7E6" android:strokeWidth="1.5" android:pathData="M54,16 A38,38 0,1 0,54 92 A38,38 0,1 0,54 16 M16,54h76 M54,16v76 M30,54 C30,32 40,16 54,16 C68,16 78,32 78,54 C78,76 68,92 54,92 C40,92 30,76 30,54"/>
            <path android:fillColor="#00000000" android:strokeColor="#FF354A" android:strokeWidth="2.5" android:pathData="M54,35 A9,9 0,1 0,54 53 A9,9 0,1 0,54 35 M54,27v34 M37,44h34 M72,63 A11,11 0,1 0,72 85 A11,11 0,1 0,72 63 M72,58v32 M56,74h32"/>
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@android:color/black"/><foreground android:drawable="@drawable/ic_worldwatch_foreground"/></adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WORLDWATCH-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
